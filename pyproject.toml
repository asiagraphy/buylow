[project]
name = "buylow-orchestrator"
version = "0.3.0"
description = "buylow orchestrator: runs LEAN backtests/live jobs and serves the dashboard"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",          # 대시보드 템플릿
    "python-multipart>=0.0.9",  # HTML 폼(Form) 처리
    "pyyaml>=6.0",          # config.local.yaml
    "pykrx>=1.2.8",         # KRX 시세/펀더멘털 소스 (ETL)
    "finance-datareader>=0.9",  # 대체 시세 소스 (ETL)
    "apscheduler>=3.10,<4",    # APScheduler 3.x 스케줄러 API
    "requests>=2.32",      # 증권사 REST 클라이언트
    "pandas>=2.2,<3",      # ETL 및 LEAN Python 전략
    "numpy>=1.26,<3",
    "exchange-calendars>=4.5,<5",  # 미국 휴장일·조기폐장·서머타임
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",        # FastAPI TestClient용
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "brokers", "etl", "market", "strategies"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: 전체 LEAN 툴체인(.NET+데이터)이 필요한 end-to-end 테스트. 기본 실행에서 제외",
]
# 기본 pytest 실행은 빠른 테스트만 (integration은 'pytest -m integration'으로)
addopts = "-m 'not integration'"
